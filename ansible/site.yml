---
# ============================================================================
# site.yml - master entrypoint. Currently a thin wrapper around deploy.yml so
# `ansible-playbook site.yml` performs the full end-to-end deployment.
# ============================================================================

- name: Pre-flight — install Ansible collections and init Terraform providers
  hosts: local
  gather_facts: false
  tasks:

    - name: Install required Ansible collections
      ansible.builtin.command: ansible-galaxy collection install -r requirements.yml
      args:
        chdir: "{{ playbook_dir }}"
      changed_when: false

    - name: Terraform init (download providers)
      ansible.builtin.command:
        cmd: terraform init -input=false
        chdir: "{{ tf_dir }}"
      changed_when: false

- name: main-app end-to-end deployment
  ansible.builtin.import_playbook: deploy.yml
