{{- if .Values.appConnectionSecret.create }}
# ---------------------------------------------------------------------------
# Application connection secret (app-postgres-app).
# CNPG does NOT auto-generate the <cluster>-app secret when a custom
# bootstrap.initdb.secret is supplied, so we create it here with the "uri"
# key that the auth + backend services consume via DATABASE_URL.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.database.appSecretName }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/part-of: main-app
    app.kubernetes.io/component: database
type: Opaque
stringData:
  uri: "postgresql://{{ .Values.global.database.user }}:{{ .Values.credentials.password }}@{{ .Values.global.database.host }}:{{ .Values.global.database.port }}/{{ .Values.global.database.name }}"
  username: {{ .Values.global.database.user | quote }}
  password: {{ .Values.credentials.password | quote }}
  host: {{ .Values.global.database.host | quote }}
  port: {{ .Values.global.database.port | quote }}
  database: {{ .Values.global.database.name | quote }}
{{- end }}
