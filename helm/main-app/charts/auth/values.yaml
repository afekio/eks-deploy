# ---------------------------------------------------------------------------
# auth subchart defaults
# ---------------------------------------------------------------------------

global:
  namespace: main-app
  image:
    registry: docker.io
    repository: afekio/main-project
    pullPolicy: IfNotPresent
  serviceAccount:
    name: app-irsa-sa
  database:
    appSecretName: app-postgres-app

nameOverride: auth
replicaCount: 2

image:
  # Final image = {registry}/{repository}:{tag}
  tag: auth0.4
  # Optional per-service overrides (fall back to global.image.* when empty).
  registry: ""
  repository: ""
  pullPolicy: ""

# Wait for PostgreSQL before starting (auth runs db.create_all() on boot).
waitForPostgres:
  enabled: true
  image: busybox:1.36
  host: app-postgres-rw.main-app.svc.cluster.local
  port: 5432
  intervalSeconds: 10

service:
  type: ClusterIP
  port: 5001
  targetPort: http

containerPort: 5001

# Env mounted from the shared ConfigMap + Secret (created by the common subchart).
envFrom:
  configMapName: app-config
  secretName: app-secrets

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

readinessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

livenessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 30
  periodSeconds: 20
