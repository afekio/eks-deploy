server {
    listen 80;
    server_name _;

    # 1. AWS VPC DNS Resolver: Added 'ipv6=off' to prevent DNS timeout issues
    resolver 169.254.169.253 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- Auth Service ---
    # Matches exactly what React sends: /api/login, /api/register, /api/user, /api/auth
    location ~ ^/api/(login|register|user|auth) {
        # 2. Moved the variable INSIDE the location block. 
        # This ensures Nginx only resolves the DNS when this specific route is hit.
        set $auth_backend "http://auth.afek.local:5001";
        
        proxy_pass $auth_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- Provisioning / Backend Service ---
    # 3. Expanded the regex to catch /api/transactions and /api/ai (based on your Python code!)
    location ~ ^/api/(provision|transactions|ai) {
        set $prov_backend "http://backend.afek.local:5000";
        
        proxy_pass $prov_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- React Frontend ---
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}